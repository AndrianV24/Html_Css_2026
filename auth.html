<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация и Вход</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <img src="./Resources/pic.png" alt="Лого" class="logo">
        <nav>
            <a href="index.html">Начало</a>
            <a href="courses.html">Курсове</a>
            <a href="contacts.html">Контакти</a>
            <a href="auth.html">Регистрация и вход</a>
        </nav>
    </header>

    <main>
        <h1 style="text-align: center;">Регистрация и Вход</h1>

        <div class="auth-container">

            <div class="auth-box">
                <h2>Вход</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="login-email">Имейл:</label>
                        <input type="email" id="login-email" name="login-email" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Парола:</label>
                        <input type="password" id="login-password" name="login-password" required>
                    </div>

                    <button type="submit" class="btn">Влез</button>
                </form>
            </div>

            <div class="auth-box">
                <h2>Регистрация</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="reg-names">Две имена:</label>
                        <input type="text" id="reg-names" name="reg-names" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Имейл:</label>
                        <input type="email" id="reg-email" name="reg-email" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Парола:</label>
                        <input type="password" id="reg-password" name="reg-password" required>
                    </div>

                    <button type="submit" class="btn">Регистрирай се</button>
                </form>
            </div>

        </div>
        
        <div class="text-center">
            <a href="index.html" class="btn">Към Начална Страница</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Център за обучение по софтуерно инженерство.</p>
    </footer>

</body>
</html>
